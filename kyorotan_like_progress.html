<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いいね進捗 HUD</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
}
body{display:flex;align-items:center;justify-content:center}
.hud{
  width:min(94vw,1000px);
  padding:28px 38px 30px;
  position:relative;
  color:#eaffff;
  background:linear-gradient(135deg,rgba(3,15,28,.90),rgba(8,10,34,.86));
  border:2px solid rgba(70,230,255,.72);
  clip-path:polygon(3% 0,97% 0,100% 20%,100% 80%,97% 100%,3% 100%,0 80%,0 20%);
  box-shadow:inset 0 0 28px rgba(0,234,255,.08);
}
.hud:before,.hud:after{
  content:"";position:absolute;top:0;width:35%;height:3px;
  box-shadow:0 0 15px currentColor;
}
.hud:before{left:8%;background:#00eaff;color:#00eaff}
.hud:after{right:8%;background:#765cff;color:#765cff}

.title{
  text-align:center;font-size:30px;font-weight:800;letter-spacing:.08em;
  text-shadow:0 0 12px rgba(0,234,255,.55);
}
.count{
  margin-top:8px;text-align:center;font-size:46px;font-weight:900;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(0,234,255,.75);
}
.bar-shell{
  height:32px;margin-top:20px;padding:4px;
  border:1px solid rgba(130,240,255,.65);
  background:rgba(0,0,0,.42);
  clip-path:polygon(1.5% 0,98.5% 0,100% 50%,98.5% 100%,1.5% 100%,0 50%);
}
.bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00eaff,#3f9cff,#765cff);
  box-shadow:0 0 18px rgba(0,234,255,.75);
  transition:width .35s ease;
}
.total{
  margin-top:18px;text-align:center;font-size:27px;font-weight:700;
  color:rgba(235,252,255,.9);letter-spacing:.05em;
}
.total span{font-size:31px;color:white;font-variant-numeric:tabular-nums}
.achieved{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(2,8,22,.94);font-size:46px;font-weight:900;letter-spacing:.06em;
  color:#efffff;text-shadow:0 0 12px #00eaff,0 0 28px #765cff;
  opacity:0;pointer-events:none;
}
.achieved.show{animation:flash 2.6s ease both}
@keyframes flash{
  0%{opacity:0;transform:scale(.94)}
  12%,72%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04)}
}
.hint{
  position:fixed;bottom:8px;right:10px;color:rgba(255,255,255,.2);
  font-size:11px
}
</style>
</head>
<body>
<div class="hud">
  <div class="title">❤️ 次の10,000いいねまで</div>
  <div class="count"><span id="progress">0</span> / 10,000</div>
  <div class="bar-shell"><div class="bar" id="bar"></div></div>
  <div class="total">累計いいね　<span id="total">0</span></div>
  <div class="achieved" id="achieved">✨ 10,000いいね達成！ ✨</div>
</div>
<div class="hint">TEST: ↑ +100 / ↓ -100 / Space +1,000 / R reset</div>

<script>
let totalLikes = Number(localStorage.getItem("kyorotan_total_likes") || 0);
let lastMilestone = Math.floor(totalLikes / 10000);

const fmt=n=>Math.max(0,Math.floor(n)).toLocaleString("ja-JP");
function render(animate=true){
  totalLikes=Math.max(0,Math.floor(totalLikes));
  const progress=totalLikes%10000;
  document.getElementById("progress").textContent=fmt(progress);
  document.getElementById("total").textContent=fmt(totalLikes);
  document.getElementById("bar").style.width=(progress/10000*100)+"%";
  const milestone=Math.floor(totalLikes/10000);
  if(animate && milestone>lastMilestone && totalLikes>0){
    const a=document.getElementById("achieved");
    a.classList.remove("show"); void a.offsetWidth; a.classList.add("show");
  }
  lastMilestone=milestone;
  localStorage.setItem("kyorotan_total_likes",String(totalLikes));
}
function addLikes(n){ totalLikes+=n; render(true); }

/* Later, TikTok/TikFinity integration can call:
   window.addLikes(1) or window.setTotalLikes(12345)
*/
window.addLikes=addLikes;
window.setTotalLikes=function(n){ totalLikes=Number(n)||0; render(true); };

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") addLikes(100);
  if(e.key==="ArrowDown") addLikes(-100);
  if(e.code==="Space"){e.preventDefault();addLikes(1000);}
  if(e.key.toLowerCase()==="r"){totalLikes=0;lastMilestone=0;render(false);}
});
render(false);
</script>
</body>
</html>
