<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYOROTAN Neon Fullscreen Background</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02060d;
}
#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 18%,rgba(0,234,255,.22),transparent 30%),
    radial-gradient(circle at 88% 78%,rgba(140,75,255,.20),transparent 32%),
    linear-gradient(180deg,#02060d 0%,#06101b 48%,#02050b 100%);
}
.grid{
  position:absolute;
  inset:0;
  opacity:.22;
  background-image:
    linear-gradient(rgba(0,234,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.12) 1px,transparent 1px);
  background-size:6vw 6vw;
  animation:gridMove 12s linear infinite;
}
@keyframes gridMove{
  to{background-position:0 6vw,6vw 0}
}
.edge{
  position:absolute;
  top:0;
  bottom:0;
  width:10%;
  opacity:.9;
  pointer-events:none;
}
.edge.left{
  left:0;
  background:linear-gradient(90deg,rgba(0,234,255,.28),transparent);
}
.edge.right{
  right:0;
  background:linear-gradient(270deg,rgba(140,75,255,.24),transparent);
}
.beam{
  position:absolute;
  left:-20%;
  width:140%;
  height:2px;
  background:linear-gradient(90deg,transparent,#00eaff,rgba(150,80,255,.85),transparent);
  box-shadow:0 0 20px rgba(0,234,255,.75);
  opacity:0;
  animation:scan 7s linear infinite;
}
.beam.two{animation-delay:-3.5s}
@keyframes scan{
  0%{top:-2%;opacity:0}
  8%{opacity:.6}
  85%{opacity:.16}
  100%{top:102%;opacity:0}
}
.corner{
  position:absolute;
  width:14%;
  height:9%;
  border-color:rgba(0,234,255,.55);
  opacity:.75;
}
.tl{left:2.8%;top:1.8%;border-left:2px solid;border-top:2px solid}
.tr{right:2.8%;top:1.8%;border-right:2px solid;border-top:2px solid}
.bl{left:2.8%;bottom:1.8%;border-left:2px solid;border-bottom:2px solid}
.br{right:2.8%;bottom:1.8%;border-right:2px solid;border-bottom:2px solid}
.circuit{
  position:absolute;
  width:24%;
  height:16%;
  opacity:.44;
}
.c1{left:2.2%;top:14%}
.c2{right:2.2%;bottom:14%;transform:rotate(180deg)}
.line{
  position:absolute;
  background:#00eaff;
  box-shadow:0 0 8px rgba(0,234,255,.75);
}
.h1{width:68%;height:2px;left:0;top:12%}
.v1{width:2px;height:40%;left:68%;top:12%}
.h2{width:46%;height:2px;left:22%;top:52%}
.v2{width:2px;height:34%;left:22%;top:52%}
.node{
  position:absolute;
  width:8px;
  height:8px;
  border:1px solid #00eaff;
  transform:rotate(45deg);
  box-shadow:0 0 10px rgba(0,234,255,.8);
  animation:pulse 2.6s ease-in-out infinite;
}
.n1{left:66.5%;top:50%}
.n2{left:20.5%;top:84%;animation-delay:-1.3s}
@keyframes pulse{
  0%,100%{opacity:.25}
  50%{opacity:1}
}
.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#bffaff;
  box-shadow:0 0 10px #00eaff;
  opacity:0;
  animation:float 8s linear infinite;
}
@keyframes float{
  0%{transform:translateY(8vh);opacity:0}
  15%{opacity:.8}
  100%{transform:translateY(-55vh);opacity:0}
}
.p1{left:10%;bottom:0}
.p2{left:24%;bottom:-8%;animation-delay:-2s}
.p3{left:78%;bottom:-3%;animation-delay:-4s}
.p4{left:91%;bottom:-10%;animation-delay:-6s}
.centerFade{
  position:absolute;
  inset:8% 10%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.02),rgba(0,0,0,.46) 88%);
  pointer-events:none;
}
</style>
</head>
<body>
<div id="bg">
  <div class="grid"></div>
  <div class="edge left"></div>
  <div class="edge right"></div>
  <div class="beam"></div>
  <div class="beam two"></div>

  <div class="circuit c1">
    <i class="line h1"></i><i class="line v1"></i>
    <i class="line h2"></i><i class="line v2"></i>
    <i class="node n1"></i><i class="node n2"></i>
  </div>
  <div class="circuit c2">
    <i class="line h1"></i><i class="line v1"></i>
    <i class="line h2"></i><i class="line v2"></i>
    <i class="node n1"></i><i class="node n2"></i>
  </div>

  <i class="particle p1"></i><i class="particle p2"></i>
  <i class="particle p3"></i><i class="particle p4"></i>

  <div class="centerFade"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
</div>
</body>
</html>
