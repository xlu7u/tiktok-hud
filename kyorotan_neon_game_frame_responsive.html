<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYOROTAN Responsive Neon Game Frame</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}
#frame{
  position:absolute;
  inset:0;
  box-sizing:border-box;
  background:transparent;
  pointer-events:none;
}

/* responsive neon frame that always follows source bounds */
.game-frame{
  position:absolute;
  inset:0;
  box-sizing:border-box;
}

/* Main rails */
.rail{
  position:absolute;
  pointer-events:none;
}
.rail.top,.rail.bottom{
  left:7%;
  right:7%;
  height:3px;
  background:linear-gradient(90deg,transparent,#00eaff,#5f7cff,#8b4dff,transparent);
  box-shadow:0 0 8px rgba(0,234,255,.85),0 0 18px rgba(95,124,255,.45);
  opacity:.9;
}
.rail.top{top:0}
.rail.bottom{bottom:0}

.rail.left,.rail.right{
  top:7%;
  bottom:7%;
  width:3px;
  background:linear-gradient(180deg,transparent,#00eaff,#5f7cff,#8b4dff,transparent);
  box-shadow:0 0 8px rgba(0,234,255,.85),0 0 18px rgba(95,124,255,.45);
  opacity:.9;
}
.rail.left{left:0}
.rail.right{right:0}

/* Corner brackets scale with source size */
.corner{
  position:absolute;
  width:14%;
  height:14%;
  min-width:40px;
  min-height:40px;
  max-width:160px;
  max-height:160px;
  filter:drop-shadow(0 0 10px rgba(0,234,255,.7));
  box-sizing:border-box;
}
.tl{left:0;top:0;border-left:4px solid #00eaff;border-top:4px solid #00eaff}
.tr{right:0;top:0;border-right:4px solid #7c5cff;border-top:4px solid #7c5cff}
.bl{left:0;bottom:0;border-left:4px solid #00eaff;border-bottom:4px solid #00eaff}
.br{right:0;bottom:0;border-right:4px solid #7c5cff;border-bottom:4px solid #7c5cff}

/* Angled armor accents */
.plate{
  position:absolute;
  top:0;
  width:18%;
  min-width:70px;
  max-width:220px;
  height:26px;
  background:linear-gradient(90deg,rgba(0,234,255,.10),rgba(90,80,255,.15));
  border:1px solid rgba(90,220,255,.45);
  box-shadow:0 0 14px rgba(0,234,255,.18);
  clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);
}
.plate.left{left:17%}
.plate.right{right:17%;transform:scaleX(-1)}

.label{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font-family:"Segoe UI","Yu Gothic UI",Arial,sans-serif;
  font-size:clamp(10px,1.4vw,18px);
  letter-spacing:.24em;
  color:#dffcff;
  text-shadow:0 0 10px rgba(0,234,255,.75);
  white-space:nowrap;
}
.label::before{
  content:"●";
  color:#00eaff;
  margin-right:8px;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.25}
  50%{opacity:1}
}

/* Moving light runners use percentage travel */
.runner{
  position:absolute;
  top:-1px;
  left:4%;
  width:13%;
  min-width:45px;
  height:4px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#d8ffff,transparent);
  box-shadow:0 0 14px #00eaff;
  animation:runTop 4.8s linear infinite;
}
@keyframes runTop{
  0%{left:4%;opacity:0}
  10%{opacity:1}
  90%{opacity:.7}
  100%{left:83%;opacity:0}
}
.runner-bottom{
  position:absolute;
  bottom:-1px;
  right:4%;
  width:13%;
  min-width:45px;
  height:4px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#d8ffff,transparent);
  box-shadow:0 0 14px #7c5cff;
  animation:runBottom 5.4s linear infinite;
}
@keyframes runBottom{
  0%{right:4%;opacity:0}
  10%{opacity:1}
  100%{right:83%;opacity:0}
}

/* subtle scan */
.scan{
  position:absolute;
  left:2%;
  right:2%;
  height:2px;
  top:4%;
  background:linear-gradient(90deg,transparent,rgba(0,234,255,.55),rgba(124,92,255,.45),transparent);
  opacity:0;
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{
  0%{top:4%;opacity:0}
  10%{opacity:.28}
  85%{opacity:.08}
  100%{top:96%;opacity:0}
}

/* small data ticks */
.ticks{
  position:absolute;
  display:flex;
  gap:7px;
}
.ticks.top-left{left:3%;top:4%}
.ticks.bottom-right{right:3%;bottom:4%}
.ticks span{
  width:8px;
  height:3px;
  background:#00eaff;
  opacity:.3;
  box-shadow:0 0 6px rgba(0,234,255,.7);
  animation:tick 2.2s ease-in-out infinite;
}
.ticks span:nth-child(2){animation-delay:-.55s}
.ticks span:nth-child(3){animation-delay:-1.1s}
.ticks span:nth-child(4){animation-delay:-1.65s}
@keyframes tick{
  0%,100%{opacity:.18;transform:scaleX(.6)}
  50%{opacity:1;transform:scaleX(1)}
}
</style>
</head>
<body>
<div id="frame">
  <div class="game-frame">
    <div class="rail top"></div>
    <div class="rail bottom"></div>
    <div class="rail left"></div>
    <div class="rail right"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="plate left"></div>
    <div class="plate right"></div>

    <div class="label">GAME FEED</div>

    <div class="runner"></div>
    <div class="runner-bottom"></div>

    <div class="ticks top-left"><span></span><span></span><span></span><span></span></div>
    <div class="ticks bottom-right"><span></span><span></span><span></span><span></span></div>

    <div class="scan"></div>
  </div>
</div>
</body>
</html>
