<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYOROTAN Neon Cyber Background</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#bg{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(circle at 10% 15%,rgba(0,234,255,.18),transparent 28%),
    radial-gradient(circle at 90% 78%,rgba(130,70,255,.16),transparent 30%),
    linear-gradient(180deg,#02060d 0%,#06101b 48%,#02050b 100%);
}
.grid{
  position:absolute;inset:0;opacity:.20;
  background-image:
    linear-gradient(rgba(0,234,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.12) 1px,transparent 1px);
  background-size:64px 64px;
  animation:gridMove 12s linear infinite;
}
@keyframes gridMove{to{background-position:0 64px,64px 0}}
.edge{position:absolute;top:0;bottom:0;width:90px;opacity:.8}
.edge.left{left:0;background:linear-gradient(90deg,rgba(0,234,255,.22),transparent)}
.edge.right{right:0;background:linear-gradient(270deg,rgba(130,70,255,.20),transparent)}
.beam{
  position:absolute;left:-30%;width:160%;height:3px;
  background:linear-gradient(90deg,transparent,#00eaff,rgba(150,80,255,.8),transparent);
  box-shadow:0 0 18px rgba(0,234,255,.7);
  opacity:0;animation:scan 7s linear infinite;
}
@keyframes scan{
  0%{top:-20px;opacity:0}
  8%{opacity:.55}
  85%{opacity:.18}
  100%{top:1940px;opacity:0}
}
.circuit{position:absolute;width:260px;height:260px;opacity:.42}
.c1{left:22px;top:270px}.c2{right:22px;bottom:270px;transform:rotate(180deg)}
.line{position:absolute;background:#00eaff;box-shadow:0 0 8px rgba(0,234,255,.7)}
.h1{width:180px;height:2px;left:0;top:30px}.v1{width:2px;height:100px;left:178px;top:30px}
.h2{width:120px;height:2px;left:60px;top:130px}.v2{width:2px;height:85px;left:58px;top:130px}
.node{position:absolute;width:8px;height:8px;border:1px solid #00eaff;transform:rotate(45deg);box-shadow:0 0 10px rgba(0,234,255,.8);animation:pulse 2.6s ease-in-out infinite}
.n1{left:174px;top:126px}.n2{left:54px;top:210px;animation-delay:-1.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#bffaff;box-shadow:0 0 10px #00eaff;opacity:0;animation:float 8s linear infinite}
@keyframes float{0%{transform:translateY(80px);opacity:0}15%{opacity:.8}100%{transform:translateY(-700px);opacity:0}}
.p1{left:10%;bottom:0}.p2{left:23%;bottom:-120px;animation-delay:-2s}.p3{left:78%;bottom:-40px;animation-delay:-4s}.p4{left:91%;bottom:-180px;animation-delay:-6s}
.safe{
  position:absolute;left:125px;right:125px;top:300px;bottom:300px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.08),rgba(0,0,0,.48) 82%);
}
.corner{position:absolute;width:150px;height:150px;border-color:rgba(0,234,255,.5)}
.tl{left:30px;top:30px;border-left:2px solid;border-top:2px solid}
.tr{right:30px;top:30px;border-right:2px solid;border-top:2px solid}
.bl{left:30px;bottom:30px;border-left:2px solid;border-bottom:2px solid}
.br{right:30px;bottom:30px;border-right:2px solid;border-bottom:2px solid}
</style>
</head>
<body>
<div id="bg">
  <div class="grid"></div><div class="edge left"></div><div class="edge right"></div>
  <div class="beam"></div><div class="beam" style="animation-delay:-3.5s;opacity:.25"></div>
  <div class="circuit c1"><i class="line h1"></i><i class="line v1"></i><i class="line h2"></i><i class="line v2"></i><i class="node n1"></i><i class="node n2"></i></div>
  <div class="circuit c2"><i class="line h1"></i><i class="line v1"></i><i class="line h2"></i><i class="line v2"></i><i class="node n1"></i><i class="node n2"></i></div>
  <i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i><i class="particle p4"></i>
  <div class="safe"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
</div>
</body>
</html>
