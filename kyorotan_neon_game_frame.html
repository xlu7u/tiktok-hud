<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYOROTAN Neon Game Frame</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}
#frame{
  position:relative;
  width:1080px;
  height:1920px;
  background:transparent;
  pointer-events:none;
}
.game-frame{
  position:absolute;
  left:120px;
  top:500px;
  width:840px;
  height:900px;
  box-sizing:border-box;
}

/* main neon rails */
.rail{
  position:absolute;
  background:linear-gradient(90deg,transparent,#00eaff,#5f7cff,#8b4dff,transparent);
  box-shadow:
    0 0 8px rgba(0,234,255,.8),
    0 0 18px rgba(95,124,255,.45);
  opacity:.85;
}
.rail.top,.rail.bottom{
  left:70px;
  right:70px;
  height:3px;
}
.rail.top{top:0}
.rail.bottom{bottom:0}
.rail.left,.rail.right{
  top:70px;
  bottom:70px;
  width:3px;
  background:linear-gradient(180deg,transparent,#00eaff,#5f7cff,#8b4dff,transparent);
}
.rail.left{left:0}
.rail.right{right:0}

/* corner armor */
.corner{
  position:absolute;
  width:120px;
  height:120px;
  border-color:#00eaff;
  filter:drop-shadow(0 0 10px rgba(0,234,255,.65));
}
.tl{left:0;top:0;border-left:4px solid;border-top:4px solid}
.tr{right:0;top:0;border-right:4px solid;border-top:4px solid;border-color:#7c5cff}
.bl{left:0;bottom:0;border-left:4px solid;border-bottom:4px solid}
.br{right:0;bottom:0;border-right:4px solid;border-bottom:4px solid;border-color:#7c5cff}

/* angled plates */
.plate{
  position:absolute;
  width:180px;
  height:34px;
  top:-15px;
  background:linear-gradient(90deg,rgba(0,234,255,.12),rgba(88,80,255,.16));
  border:1px solid rgba(90,220,255,.45);
  box-shadow:0 0 14px rgba(0,234,255,.18);
  clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);
}
.plate.left{left:140px}
.plate.right{right:140px;transform:scaleX(-1)}

.label{
  position:absolute;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
  font-family:"Segoe UI","Yu Gothic UI",Arial,sans-serif;
  font-size:18px;
  letter-spacing:.26em;
  color:#dffcff;
  text-shadow:0 0 10px rgba(0,234,255,.75);
  white-space:nowrap;
}
.label::before{
  content:"●";
  color:#00eaff;
  margin-right:10px;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.25}
  50%{opacity:1}
}

/* moving light */
.runner{
  position:absolute;
  height:4px;
  width:110px;
  top:-1px;
  left:30px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#d8ffff,transparent);
  box-shadow:0 0 14px #00eaff;
  animation:runTop 4.8s linear infinite;
}
@keyframes runTop{
  0%{transform:translateX(0);opacity:0}
  10%{opacity:1}
  90%{opacity:.7}
  100%{transform:translateX(650px);opacity:0}
}

.runner-bottom{
  position:absolute;
  height:4px;
  width:110px;
  bottom:-1px;
  right:30px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#d8ffff,transparent);
  box-shadow:0 0 14px #7c5cff;
  animation:runBottom 5.4s linear infinite;
}
@keyframes runBottom{
  0%{transform:translateX(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateX(-650px);opacity:0}
}

/* side data ticks */
.ticks{
  position:absolute;
  display:flex;
  gap:9px;
}
.ticks.top-left{left:24px;top:24px}
.ticks.bottom-right{right:24px;bottom:24px}
.ticks span{
  width:8px;
  height:3px;
  background:#00eaff;
  opacity:.3;
  box-shadow:0 0 6px rgba(0,234,255,.7);
  animation:tick 2.2s ease-in-out infinite;
}
.ticks span:nth-child(2){animation-delay:-.55s}
.ticks span:nth-child(3){animation-delay:-1.1s}
.ticks span:nth-child(4){animation-delay:-1.65s}
@keyframes tick{
  0%,100%{opacity:.18;transform:scaleX(.6)}
  50%{opacity:1;transform:scaleX(1)}
}

/* subtle scan through the game area */
.scan{
  position:absolute;
  left:18px;
  right:18px;
  height:2px;
  top:30px;
  background:linear-gradient(90deg,transparent,rgba(0,234,255,.6),rgba(124,92,255,.5),transparent);
  opacity:0;
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:.28}
  85%{opacity:.08}
  100%{transform:translateY(810px);opacity:0}
}
</style>
</head>
<body>
<div id="frame">
  <div class="game-frame">
    <div class="rail top"></div>
    <div class="rail bottom"></div>
    <div class="rail left"></div>
    <div class="rail right"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="plate left"></div>
    <div class="plate right"></div>

    <div class="label">GAME FEED</div>

    <div class="runner"></div>
    <div class="runner-bottom"></div>

    <div class="ticks top-left"><span></span><span></span><span></span><span></span></div>
    <div class="ticks bottom-right"><span></span><span></span><span></span><span></span></div>

    <div class="scan"></div>
  </div>
</div>
</body>
</html>
